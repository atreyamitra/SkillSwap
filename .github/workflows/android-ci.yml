name: Android CI

# Minimum bar this workflow guarantees, per docs/SDLC.md:
#   1. checkout
#   2. configure the correct JDK (17, matching app/build.gradle's compileOptions)
#   3. build
#   4. run tests
#   5. fail the whole workflow on any test failure (Gradle's own exit code -
#      no extra "continue-on-error" anywhere here)

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    name: Unit tests + static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run local JVM unit + integration tests
        # Covers app/src/test/java in full: models/, utils/, ledger/, and
        # ledger/sql/ (H2-backed integration tests) all run here - there is no
        # separate "integration" Gradle task, because they're all plain JUnit
        # tests in the same source set. See docs/SDLC.md "Testing".
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint (static analysis)
        run: ./gradlew lintDebug --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html

  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Provide placeholder google-services.json
        # CI has no real Firebase project; this placeholder (checked in at
        # app/google-services.json.example) is only structurally valid, just
        # enough for the Google Services Gradle plugin to generate resources
        # and let the build compile. See BUILD_NOTES.md §3.
        run: cp app/google-services.json.example app/google-services.json

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
