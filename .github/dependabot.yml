version: 2
updates:
  # Gradle dependencies (AndroidX, Firebase, JUnit, H2, AGP itself via build.gradle)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # The GitHub Actions used by .github/workflows/android-ci.yml itself
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
